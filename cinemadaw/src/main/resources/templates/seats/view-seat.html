<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

	<div th:fragment="content">

		<h1>Mapa de seients</h1>
		<h2 th:text="${room.name} + ' - Capacitat: ' + ${room.capacity}">Sala i capacitat</h2>

		<p th:if="${reserveSuccess}">Reserva completada. El seient reservat ja no es pot seleccionar.</p>

		<svg xmlns="http://www.w3.org/2000/svg"
			 th:attr="viewBox='0 0 ' + ${svgWidth} + ' ' + ${svgHeight}"
			 style="width: 100%; max-width: 420px; height: auto; border: 1px solid #ddd; border-radius: 6px; padding: 8px; background-color: #fff;">

			<g th:each="seat : ${llista}">

				<a th:if="${seat.state}" th:href="@{/seat/{id}(id=${seat.id})}">
					<svg class="seat" viewBox="0 0 491.5 491.5" width="16" height="16"
						 th:x="${seat.x * 34 + 8}" th:y="${seat.y * 34 + 8}"
						 xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<title th:text="'Fila ' + ${seat.seatRow} + ' Seient ' + ${seat.number} + ' Disponible'"></title>
						<path d="M449.149,216.2v-99c0-64.7-53.4-117.2-119.1-117.2h-168.4c-65.6,0-119.1,52.6-119.1,117.2v99c-25,12.1-42.5,37.5-42.5,67.1v208.2h163.8V471h163.8v20.5h163.8V283.3C491.649,253.7,474.149,228.2,449.149,216.2z M122.949,307.2v41v102.4h-81.9V283.3c0-16,11.2-29.4,26.2-32.8h0.2c2.6-0.6,5-0.9,7.3-0.9h14.4c18.6,0,33.8,15.1,33.8,33.8V307.2z M327.749,348.1h-163.8v-41h163.8V348.1z M368.749,450.5V348.1v-41v-23.9c0-18.6,15.1-33.8,33.8-33.8h14.3c2.3,0,4.7,0.3,7.3,0.9h0.2c15,3.4,26.2,16.8,26.2,32.8v167.4H368.749z" fill="#5d7f5f"/>
					</svg>
				</a>

				<svg th:if="${!seat.state}" class="seat" viewBox="0 0 491.5 491.5" width="16" height="16"
					 th:x="${seat.x * 34 + 8}" th:y="${seat.y * 34 + 8}"
					 xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<title th:text="'Fila ' + ${seat.seatRow} + ' Seient ' + ${seat.number} + ' Reservat'"></title>
					<path d="M449.149,216.2v-99c0-64.7-53.4-117.2-119.1-117.2h-168.4c-65.6,0-119.1,52.6-119.1,117.2v99c-25,12.1-42.5,37.5-42.5,67.1v208.2h163.8V471h163.8v20.5h163.8V283.3C491.649,253.7,474.149,228.2,449.149,216.2z M122.949,307.2v41v102.4h-81.9V283.3c0-16,11.2-29.4,26.2-32.8h0.2c2.6-0.6,5-0.9,7.3-0.9h14.4c18.6,0,33.8,15.1,33.8,33.8V307.2z M327.749,348.1h-163.8v-41h163.8V348.1z M368.749,450.5V348.1v-41v-23.9c0-18.6,15.1-33.8,33.8-33.8h14.3c2.3,0,4.7,0.3,7.3,0.9h0.2c15,3.4,26.2,16.8,26.2,32.8v167.4H368.749z" fill="#b5b5b5"/>
				</svg>

			</g>

		</svg>

		<p>Verd: disponible | Gris: reservat</p>

		<div th:if="${isAdmin}">
			<h3>Gestio de seients</h3>
			<ul>
				<li th:each="seat : ${llista}">
					<span th:text="'Fila: ' + ${seat.seatRow} + ' | Numero: ' + ${seat.number} + ' | Estat: ' + (${seat.state} ? 'Disponible' : 'Reservat')"></span>
					|
					<a th:href="@{/seat/{id}(id=${seat.id})}">Detall</a>
					|
					<a th:href="@{/seat/edit/{id}(id=${seat.id})}">Editar</a>
					|
					<a th:href="@{/seat/delete/{id}(id=${seat.id})}" onclick="return confirm('Vols eliminar aquest seient?');">Eliminar</a>
				</li>
			</ul>
		</div>

        
	</div>

</div>

</body>
</html>
