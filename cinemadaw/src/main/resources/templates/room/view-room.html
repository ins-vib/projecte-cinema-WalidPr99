<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Detalls de la sala: <span th:text="${room.name}"></span></h1>

        <a th:href="@{/seats/{id}(id=${room.id})}">Veure seients</a>
        <a th:if="${room.cinema != null}" th:href="@{/cinema/{id}(id=${room.cinema.id})}">Tornar al cinema</a>
        <a th:if="${isAdmin}" th:href="@{/room/edit/{id}(id=${room.id})}">Editar sala</a>
        <a th:if="${isAdmin}" th:href="@{/room/delete/{id}(id=${room.id})}"
           onclick="return confirm('Segur que vols eliminar aquesta sala? S\'eliminaran també tots els seients associats.');">Esborrar sala</a>

        <table>

            <thead>

                <tr>

                    <th>Nom</th>

                    <th>Capacitat</th>

                    <th>Cinema</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td th:text="${room.name}">Nom</td>

                    <td th:text="${room.capacity}">Capacitat</td>

                    <td th:text="${room.cinema != null ? room.cinema.name : '-'}">Cinema</td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
