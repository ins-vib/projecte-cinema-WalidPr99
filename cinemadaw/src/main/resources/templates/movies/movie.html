<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Llistat de pel·lícules</h1>

        <p th:if="${successMessage}" style="color:#166534;font-weight:700;" th:text="${successMessage}"></p>
        <p th:if="${errorMessage}" style="color:#b91c1c;font-weight:700;" th:text="${errorMessage}"></p>

        <a th:if="${isAdmin}" th:href="@{/movie/create}">Afegir pel·lícula</a>

        <table>

            <thead>

                <tr>

                    <th>Títol</th>

                    <th>Gènere</th>

                    <th>Durada (min)</th>

                    <th>Data estrena</th>

                    <th>Accions</th>

                </tr>

            </thead>

            <tbody>

                <tr th:if="${#lists.isEmpty(llista)}">
                    <td colspan="5">No hi ha pel·lícules registrades.</td>
                </tr>

                <tr th:each="movie : ${llista}">

                    <td th:text="${movie.title}">Títol</td>

                    <td>
                        <span th:if="${#lists.isEmpty(movie.genres)}">-</span>
                        <span th:each="g, it : ${movie.genres}">
                            <span class="seat-badge seat-badge-standard" th:text="${g.name}">Gènere</span>
                            <span th:if="${!it.last}"> </span>
                        </span>
                    </td>

                    <td th:text="${movie.duration}">Durada</td>

                    <td th:text="${movie.releaseDate}">Data</td>

                    <td>

                        <a th:href="@{/movie/{id}(id=${movie.id})}">Veure detall</a>
                        <a th:href="@{/movie/{movieId}/screenings(movieId=${movie.id})}">Projeccions</a>
                        <a th:if="${isAdmin}" th:href="@{/movie/delete/{id}(id=${movie.id})}"
                           onclick="return confirm('Segur que vols eliminar aquesta pel·lícula? S\'eliminaran també totes les projeccions associades.');">Esborrar</a>
                        <a th:if="${isAdmin}" th:href="@{/movie/edit/{id}(id=${movie.id})}">Editar</a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
