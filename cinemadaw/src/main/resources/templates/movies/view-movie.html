<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Detalls de la pel·lícula: <span th:text="${movie.title}"></span></h1>

        <table>

            <thead>

                <tr>

                    <th>Títol</th>

                    <th>Durada</th>

                    <th>Gènere</th>

                    <th>Descripció</th>

                    <th>Data d'estrena</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td th:text="${movie.title}">Títol</td>

                    <td th:text="${movie.duration}">Durada</td>

                    <td th:text="${movie.genre}">Gènere</td>

                    <td th:text="${movie.description}">Descripció</td>

                    <td th:text="${movie.releaseDate}">Data d'estrena</td>

                </tr>

            </tbody>

        </table>

        <h2>Projeccions</h2>

        <a th:href="@{/movie/{movieId}/screening/create(movieId=${movie.id})}">Afegir projeccio</a>

        <table>

            <thead>

                <tr>

                    <th>Data i hora</th>

                    <th>Preu</th>

                    <th>Sala</th>

                    <th>Accions</th>

                </tr>

            </thead>

            <tbody>

                <tr th:if="${#lists.isEmpty(screenings)}">
                    <td colspan="4">No hi ha projeccions per a aquesta pel-licula.</td>
                </tr>

                <tr th:each="screening : ${screenings}">

                    <td th:text="${#temporals.format(screening.dateTime, 'yyyy-MM-dd HH:mm')}">Data i hora</td>

                    <td th:text="${screening.price}">Preu</td>

                    <td th:text="${screening.room != null ? screening.room.name : '-'}">Sala</td>

                    <td>
                        <a th:href="@{/screening/edit/{id}(id=${screening.id})}">Editar</a>
                        <a th:href="@{/screening/delete/{id}(id=${screening.id})}">Esborrar</a>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
