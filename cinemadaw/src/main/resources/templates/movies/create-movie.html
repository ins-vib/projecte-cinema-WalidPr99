<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Introdueix les dades de la pel·lícula</h1>

        <form th:action="@{/movie/create}" th:object="${movie}" method="post">

            <br>

            <label>Títol</label>

            <br>

            <input type="text" th:field="*{title}">
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

            <br>

            <label>Durada</label>

            <br>

            <input type="number" th:field="*{duration}">
            <div th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>

            <br>

            <label>Gèneres (marca'n com a mínim un)</label>

            <br>

            <div class="genres-checkboxes" style="display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--text);font-weight:500;padding:10px 12px;border:1px solid #c5d3de;border-radius:10px;background:#fff;">
                <label th:each="g : ${allGenres}" style="display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--text);">
                    <input type="checkbox" name="genreIds" style="width:16px;height:16px;accent-color:var(--brand);"
                           th:value="${g.id}"
                           th:checked="${movie.genres != null and movie.genres.contains(g)}">
                    <span th:text="${g.name}">Gènere</span>
                </label>
            </div>
            <div th:if="${#fields.hasErrors('genres')}" th:errors="*{genres}"></div>

            <br>

            <label>Descripció</label>

            <br>

            <input type="text" th:field="*{description}">
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>

            <br>

            <label>Data d'estrena</label>

            <br>

            <input type="date" th:field="*{releaseDate}">
            <div th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}"></div>

            <br>

            <button type="submit">Crear pel·lícula</button>

        </form>

    </div>

</div>

</body>
</html>
