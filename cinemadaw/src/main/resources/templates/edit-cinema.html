<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Introdueix les dades que vols modificar del cinema</h1>

        <form th:action="@{/cinema/edit}" th:object="${cinema}" method="post">

            <input type="text" th:field="*{id}" hidden /><br>

            <br>

            <label>Nom</label>

            <br>

            <input type="text" th:field="*{name}">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

            <br>

            <label>Ciutat</label>

            <br>

            <input type="text" th:field="*{city}">
            <div th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>

            <br>

            <label>Adreça</label>

            <br>

            <input type="text" th:field="*{address}">
            <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>

            <br>

            <label>Codi postal</label>

            <br>

            <input type="text" th:field="*{postalCode}">
            <div th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>

            <br>

            <button type="submit">Editar cinema</button>

        </form>

    </div>

</div>

</body>
</html>
