<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

	<div th:fragment="content">

		<h1>Editar projeccio</h1>

		<form th:action="@{/screening/edit}" th:object="${screening}" method="post">

			<input type="hidden" th:field="*{id}" />
			<input type="hidden" th:field="*{movie.id}" />

			<br>

			<label>Data i hora</label>

			<br>

			<input type="datetime-local" th:field="*{dateTime}" required>

			<br>

			<label>Preu</label>

			<br>

			<input type="number" step="0.01" min="0" th:field="*{price}" required>

			<br>

			<label>Sala</label>

			<br>

			<select th:field="*{room.id}" required>
				<option th:each="room : ${rooms}" th:value="${room.id}"
						th:text="${room.name + ' - ' + room.cinema.name}"></option>
			</select>

			<br>

			<button type="submit">Guardar canvis</button>

		</form>

	</div>

</div>

</body>
</html>
