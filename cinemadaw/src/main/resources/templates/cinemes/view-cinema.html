<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Detalls del cinema: <span th:text="${cinema.name}"></span></h1>

        <p th:if="${successMessage}" style="color:#166534;font-weight:700;" th:text="${successMessage}"></p>
        <p th:if="${errorMessage}" style="color:#b91c1c;font-weight:700;" th:text="${errorMessage}"></p>

        <a th:if="${isAdmin}" th:href="@{/room/create/{id}(id=${cinema.id})}">Afegir sala</a>

        <table>

            <thead>

                <tr>

                    <th>Nom</th>

                    <th>Ciutat</th>

                    <th>Adreça</th>

                    <th>Codi postal</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td th:text="${cinema.name}">Nom</td>

                    <td th:text="${cinema.city}">Ciutat</td>

                    <td th:text="${cinema.address}">Adreça</td>

                    <td th:text="${cinema.postalCode}">Codi postal</td>

                </tr>

            </tbody>

        </table>

        <h2>Sales (<span th:text="${cinema.rooms != null ? #lists.size(cinema.rooms) : 0}">0</span>)</h2>

        <ul>

            <li th:each="sala : ${cinema.rooms}">

                <span th:text="${sala.name} + ' - Capacitat: ' + ${sala.capacity}"></span>
                <a th:href="@{/room/view/{id}(id=${sala.id})}">Veure Detall</a>
                <a th:if="${isAdmin}" th:href="@{/room/edit/{id}(id=${sala.id})}">Editar</a>
                <a th:if="${isAdmin}" th:href="@{/room/delete/{id}(id=${sala.id})}"
                   onclick="return confirm('Segur que vols eliminar aquesta sala? S\'eliminaran també tots els seients associats.');">Esborrar</a>
                <a th:href="@{/seats/{id}(id=${sala.id})}">Veure Seients</a>

            </li>

        </ul>

    </div>

</div>

</body>
</html>
