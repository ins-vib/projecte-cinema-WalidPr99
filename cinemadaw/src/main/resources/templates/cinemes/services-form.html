<form th:action="@{/cinema/services}" th:object="${servicesDTO}" method="post">

    <label th:each="service : ${allServices}">
        <input type="checkbox" th:field="*{services}" th:value="${service}">
        <span th:text="${service}"></span>
    </label>

    <button type="submit">Guardar</button>

</form>
