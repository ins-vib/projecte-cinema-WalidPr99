<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::content})}">

    <div th:fragment="content">

        <h1>Llistat de cinemes</h1>

        <p th:if="${successMessage}" style="color:#166534;font-weight:700;" th:text="${successMessage}"></p>
        <p th:if="${errorMessage}" style="color:#b91c1c;font-weight:700;" th:text="${errorMessage}"></p>

        <a th:if="${isAdmin}" th:href="@{/cinema/create}">Afegir cinema</a>

        <table>

            <thead>

                <tr>

                    <th>Nom</th>

                    <th>Ciutat</th>

                    <th>Adreça</th>

                    <th>Codi postal</th>

                    <th>Nº sales</th>

                    <th>Accions</th>

                </tr>

            </thead>

            <tbody>

                <tr th:if="${#lists.isEmpty(llista)}">
                    <td colspan="6">No hi ha cinemes registrats.</td>
                </tr>

                <tr th:each="cinema : ${llista}">

                    <td th:text="${cinema.name}">Nom</td>

                    <td th:text="${cinema.city}">Ciutat</td>

                    <td th:text="${cinema.address}">Adreça</td>

                    <td th:text="${cinema.postalCode}">CP</td>

                    <td th:text="${cinema.rooms != null ? #lists.size(cinema.rooms) : 0}">0</td>

                    <td>

                        <a th:href="@{/cinema/{id}(id=${cinema.id})}">Veure detall</a>
                        <a th:if="${isAdmin}" th:href="@{/cinema/delete/{id}(id=${cinema.id})}"
                           onclick="return confirm('Segur que vols eliminar aquest cinema? S\'eliminaran també totes les sales i seients associats.');">Esborrar</a>
                        <a th:if="${isAdmin}" th:href="@{/cinema/edit/{id}(id=${cinema.id})}">Editar</a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
